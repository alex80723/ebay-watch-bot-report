<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eBay 球衣雷達</title>
  <style>
    body {
      margin: 0; padding: 40px 20px;
      background: #0e0e10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8e8; text-align: center;
    }
    .emoji { font-size: 56px; line-height: 1; margin: 0 0 16px; }
    .label { font-size: 24px; font-weight: bold; margin: 0 0 10px; }
    .sub   { font-size: 15px; color: #888; margin: 0; }
  </style>
</head>
<body>
  <div class="emoji" id="emoji"></div>
  <p class="label" id="label" style=""></p>
  <p class="sub">可以關閉此頁面了。</p>

  <script>
    const DECISIONS = {
      bid:   { emoji: "✅", label: "已記錄：出價",  color: "#5dd8a6" },
      watch: { emoji: "👀", label: "已記錄：觀察",  color: "#d8b95d" },
      pass:  { emoji: "✕",  label: "已記錄：略過",  color: "#888888" },
    };
    const d = new URLSearchParams(location.search).get("d") || "";
    const m = DECISIONS[d] || { emoji: "✅", label: "已記錄", color: "#5dd8a6" };
    document.getElementById("emoji").textContent  = m.emoji;
    document.getElementById("label").textContent  = m.label;
    document.getElementById("label").style.color  = m.color;
  </script>
</body>
</html>
