<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eBay 球衣雷達 — 留言</title>
  <style>
    body {
      margin: 0; padding: 24px 16px;
      background: #0e0e10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8e8;
    }
    .card {
      max-width: 480px; margin: 0 auto;
      background: #1a1a1d; border-radius: 12px; padding: 24px;
    }
    .label { font-size: 12px; color: #888; margin: 0 0 6px; }
    .title { font-size: 14px; font-weight: bold; color: #e8e8e8; margin: 0 0 20px; line-height: 1.4; }
    textarea {
      width: 100%; box-sizing: border-box;
      background: #111; color: #e8e8e8;
      border: 1px solid #333; border-radius: 8px;
      padding: 12px; font-size: 15px; resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #5dd8a6; }
    button {
      margin-top: 14px; width: 100%; padding: 14px;
      background: #5dd8a6; color: #000;
      font-weight: bold; font-size: 15px;
      border: none; border-radius: 8px; cursor: pointer;
    }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .msg { font-size: 22px; font-weight: bold; margin: 0 0 8px; }
    .sub { font-size: 14px; color: #888; margin: 0; }
    #error-msg { color: #d85d5d; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="view-form">
      <p class="label">留言給這件商品：</p>
      <p class="title" id="listing-title"></p>
      <form id="note-form">
        <textarea id="note-text" rows="5" autofocus
          placeholder="例：版型比較難賣，但這個價格值得賭一下…"></textarea>
        <button type="submit" id="submit-btn">送出</button>
      </form>
      <p id="error-msg"></p>
    </div>
    <div id="view-success" style="display:none">
      <p class="msg" style="color:#5dd8a6;">✅ 已儲存</p>
      <p class="sub">感謝你的回饋，可以關閉此頁面了。</p>
    </div>
    <div id="view-invalid" style="display:none">
      <p class="msg" style="color:#d85d5d;">❌ 連結無效</p>
      <p class="sub" id="invalid-reason"></p>
    </div>
  </div>

  <script>
    const FEEDBACK_API = "https://btpsduweoumyokqdnvzw.supabase.co/functions/v1/feedback";

    const params = new URLSearchParams(location.search);
    const itemId     = params.get("item_id")      || "";
    const dbId       = params.get("listing_db_id") || "0";
    const token      = params.get("token")         || "";
    const titleParam = params.get("title")         || "";

    function show(id) {
      ["view-form","view-success","view-invalid"].forEach(v =>
        document.getElementById(v).style.display = v === id ? "" : "none"
      );
    }

    if (!itemId || !token) {
      document.getElementById("invalid-reason").textContent = "缺少必要參數。";
      show("view-invalid");
    } else {
      const titleEl = document.getElementById("listing-title");
      try { titleEl.textContent = decodeURIComponent(titleParam); } catch { titleEl.textContent = titleParam; }
      if (!titleParam) titleEl.style.display = "none";

      document.getElementById("note-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const note = document.getElementById("note-text").value.trim();
        const btn  = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "儲存中…";

        const fd = new FormData();
        fd.append("item_id",      itemId);
        fd.append("listing_db_id", dbId);
        fd.append("token",        token);
        fd.append("note",         note);

        try {
          const res = await fetch(FEEDBACK_API, { method: "POST", body: fd });
          const json = await res.json().catch(() => ({}));
          if (res.ok && !json.error) {
            show("view-success");
          } else {
            const errEl = document.getElementById("error-msg");
            errEl.textContent = json.error || "發生錯誤，請稍後再試。";
            errEl.style.display = "";
            btn.disabled = false;
            btn.textContent = "送出";
          }
        } catch {
          const errEl = document.getElementById("error-msg");
          errEl.textContent = "網路錯誤，請確認連線後再試。";
          errEl.style.display = "";
          btn.disabled = false;
          btn.textContent = "送出";
        }
      });
    }
  </script>
</body>
</html>
